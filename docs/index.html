<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公务员考试 · 政治理论刷题</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .header h1 { font-size: 22px; font-weight: 600; }
        .header .subtitle { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 12px;
            font-size: 14px;
        }
        .stats-bar .stat {
            background: rgba(255,255,255,0.2);
            padding: 4px 14px;
            border-radius: 20px;
        }
        .reset-btn {
            background: rgba(255,255,255,0.25);
            border: 1.5px solid rgba(255,255,255,0.6);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: 8px;
        }
        .reset-btn:hover { background: rgba(255,255,255,0.4); }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 16px 80px;
        }
        /* Navigation */
        .nav-panel {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .nav-panel h3 { font-size: 15px; margin-bottom: 10px; color: #555; }
        .source-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }
        .source-btn {
            padding: 10px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            transition: all 0.2s;
            position: relative;
        }
        .source-btn:hover { border-color: #667eea; color: #667eea; }
        .source-btn.active { background: #667eea; color: white; border-color: #667eea; }
        .source-btn .count { font-size: 11px; color: #888; margin-left: 4px; }
        .source-btn.active .count { color: rgba(255,255,255,0.8); }
        .source-btn .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ff4757;
            color: white;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
        }
        .source-btn .badge.done { background: #2ed573; }
        /* Question Card */
        .question-card {
            background: white;
            border-radius: 12px;
            padding: 24px 20px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .q-number {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .q-topic {
            display: inline-block;
            background: #f0f0ff;
            color: #667eea;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
        }
        .q-source {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 4px;
        }
        .q-type {
            display: inline-block;
            background: #fff3e0;
            color: #e67e22;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 4px;
        }
        .q-text {
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .q-blank {
            display: inline-block;
            min-width: 80px;
            border-bottom: 2px solid #667eea;
            margin: 0 4px;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        /* Options */
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            display: flex;
            align-items: flex-start;
            padding: 14px 16px;
            border: 1.5px solid #e8e8e8;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            line-height: 1.5;
        }
        .option:hover { border-color: #667eea; background: #f8f9ff; }
        .option .opt-label {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            margin-right: 12px;
            margin-top: 1px;
            transition: all 0.2s;
        }
        .option:hover .opt-label { background: #e8eaff; color: #667eea; }
        .option.selected { border-color: #667eea; background: #f0f2ff; }
        .option.selected .opt-label { background: #667eea; color: white; }
        .option.correct { border-color: #2ed573; background: #f0fff4; }
        .option.correct .opt-label { background: #2ed573; color: white; }
        .option.wrong { border-color: #ff4757; background: #fff5f5; }
        .option.wrong .opt-label { background: #ff4757; color: white; }
        .option.disabled { pointer-events: none; }
        /* True/False options */
        .tf-options {
            flex-direction: row !important;
            gap: 12px;
        }
        .tf-options .option {
            flex: 1;
            justify-content: center;
            font-weight: 500;
        }
        /* Explanation */
        .explanation {
            margin-top: 16px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            font-size: 14px;
            line-height: 1.7;
            color: #555;
            display: none;
        }
        .explanation.show { display: block; animation: fadeIn 0.3s ease; }
        .explanation strong { color: #667eea; }
        .explanation .trap { color: #ff4757; font-weight: 600; }
        /* Buttons */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-secondary { background: #f0f0f0; color: #555; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        /* Mode selector */
        .mode-selector {
            display: flex;
            background: white;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            color: #888;
            transition: all 0.2s;
        }
        .mode-btn.active { background: #667eea; color: white; }
        /* Progress */
        .progress-bar {
            height: 4px;
            background: #e8e8e8;
            border-radius: 2px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        /* Result panel */
        .result-panel {
            background: white;
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            display: none;
        }
        .result-panel.show { display: block; }
        .result-score {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
        }
        .result-label { font-size: 14px; color: #888; margin-top: 4px; }
        .result-detail {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 20px;
        }
        .result-item { text-align: center; }
        .result-item .num { font-size: 24px; font-weight: 600; }
        .result-item .num.green { color: #2ed573; }
        .result-item .num.red { color: #ff4757; }
        .result-item .label { font-size: 12px; color: #888; }
        /* Fill blank input */
        .fill-input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e8e8e8;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .fill-input:focus { border-color: #667eea; }
        .fill-input.correct { border-color: #2ed573; background: #f0fff4; }
        .fill-input.wrong { border-color: #ff4757; background: #fff5f5; }
        .correct-answer {
            margin-top: 8px;
            font-size: 14px;
            color: #2ed573;
            font-weight: 600;
            display: none;
        }
        .correct-answer.show { display: block; }
        /* Responsive */
        @media (max-width: 480px) {
            .header h1 { font-size: 18px; }
            .q-text { font-size: 15px; }
            .source-grid { grid-template-columns: repeat(2, 1fr); }
        }
        /* Hidden */
        .hidden { display: none !important; }
        /* Wrong question review card */
        .wrong-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border-left: 4px solid #ff4757;
        }
        .wrong-card .wrong-result {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .wrong-card .wrong-result .tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .wrong-card .wrong-result .tag.user { background: #ffe0e0; color: #ff4757; }
        .wrong-card .wrong-result .tag.correct { background: #e0ffe0; color: #2ed573; }
        .wrong-card .option.review-only {
            padding: 10px 14px;
            font-size: 14px;
            line-height: 1.5;
            cursor: default;
            border: 1.5px solid #e8e8e8;
            border-radius: 8px;
            margin-bottom: 6px;
            display: flex;
            align-items: flex-start;
        }
        .wrong-card .option.review-only.is-correct {
            border-color: #2ed573;
            background: #f0fff4;
        }
        .wrong-card .option.review-only.is-wrong {
            border-color: #ff4757;
            background: #fff5f5;
        }
    </style>
</head>

<script>
// ===================== QUESTION BANK =====================
let QUESTIONS = [];
let MONTHS = []; // { id: "2025_10_1", label: "2025年10月上", file: "2025_10_1.json" }

// Load questions from JSON
async function loadQuestions() {
    try {
        // Load manifest
        const manifestResp = await fetch('data/manifest.json?t=' + Date.now());
        const manifest = await manifestResp.json();
        MONTHS = manifest.months;

        // Load all questions
        for (const month of MONTHS) {
            const resp = await fetch(`data/${month.file}?t=` + Date.now());
            const questions = await resp.json();
            questions.forEach(q => {
                q.monthId = month.id;
                QUESTIONS.push(q);
            });
        }
        console.log(`Loaded ${QUESTIONS.length} questions from ${MONTHS.length} months`);
    } catch (e) {
        console.error('Failed to load questions:', e);
    }
}

// ===================== APP STATE =====================
let state = {
    mode: 'global',        // global, monthly
    activeMonth: null,     // null = all, "2025_10_1", etc.
    currentIndex: 0,
    questions: [],         // current filtered questions
    answered: {},          // { questionId: { correct: bool, userAnswer: any } }
    wrongIds: new Set(),
    correctCount: 0,
    wrongCount: 0,
};

// Load progress from localStorage + Firebase
function loadProgress() {
    try {
        const saved = localStorage.getItem('quiz_progress');
        if (saved) {
            const data = JSON.parse(saved);
            state.answered = data.answered || {};
            state.wrongIds = new Set(data.wrongIds || []);
            state.correctCount = data.correctCount || 0;
            state.wrongCount = data.wrongCount || 0;
        }
    } catch(e) {}

    // Listen to Firebase for real-time sync
    if (window.firebaseReady) {
        const progressRef = window.firebaseDb.ref('progress');
        progressRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state.answered = data.answered || {};
                state.wrongIds = new Set(data.wrongIds || []);
                state.correctCount = data.correctCount || 0;
                state.wrongCount = data.wrongCount || 0;
                updateStats();
                renderMonthGrid();
                renderQuestion();
            }
        });
    }
}

function saveProgress() {
    const progressData = {
        answered: state.answered,
        wrongIds: [...state.wrongIds],
        correctCount: state.correctCount,
        wrongCount: state.wrongCount,
    };

    try {
        localStorage.setItem('quiz_progress', JSON.stringify(progressData));
    } catch(e) {}

    // Save to Firebase
    if (window.firebaseReady) {
        window.firebaseDb.ref('progress').set(progressData);
    }
}

// ===================== MONTHS =====================
function renderMonthGrid() {
    const grid = document.getElementById('sourceGrid');
    grid.innerHTML = `<button class="source-btn ${!state.activeMonth ? 'active' : ''}" onclick="selectMonth(null)">
        全部月份 <span class="count">(${QUESTIONS.length})</span>
    </button>`;
    MONTHS.forEach(month => {
        const count = QUESTIONS.filter(q => q.monthId === month.id).length;
        const doneCount = QUESTIONS.filter(q => q.monthId === month.id && state.answered[q.id]).length;
        const isActive = state.activeMonth === month.id;
        const isDone = doneCount === count && count > 0;
        grid.innerHTML += `<button class="source-btn ${isActive ? 'active' : ''}" onclick="selectMonth('${month.id}')">
            ${month.label} <span class="count">(${doneCount}/${count})</span>
            ${isDone ? '<span class="badge done">✓</span>' : ''}
        </button>`;
    });
}

function selectMonth(monthId) {
    state.activeMonth = monthId;
    state.currentIndex = 0;
    filterQuestions();
    renderMonthGrid();
    renderQuestion();
}

// ===================== FILTER =====================
function shuffleArray(arr) {
    const shuffled = [...arr];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function filterQuestions() {
    let qs = [...QUESTIONS];

    if (state.mode === 'monthly' && state.activeMonth) {
        qs = qs.filter(q => q.monthId === state.activeMonth);
    }

    // Wrong mode: only show wrong questions
    if (state.mode === 'wrong') {
        qs = qs.filter(q => state.wrongIds.has(q.id));
    } else {
        // Normal mode: filter out already answered questions
        qs = qs.filter(q => !state.answered[q.id]);
    }

    // Shuffle in global mode
    if (state.mode === 'global') {
        qs = shuffleArray(qs);
    }

    state.questions = qs;
    document.getElementById('stat-total').textContent = qs.length;
}

function setMode(mode, btn) {
    state.mode = mode;
    state.currentIndex = 0;
    state.activeMonth = null;

    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // Show/hide monthly nav
    const monthlyNav = document.getElementById('monthlyNav');
    monthlyNav.style.display = mode === 'monthly' ? 'block' : 'none';

    filterQuestions();
    renderMonthGrid();
    renderQuestion();
}

// ===================== RENDER =====================
function renderQuestion() {
    const area = document.getElementById('questionArea');
    const result = document.getElementById('resultPanel');
    result.classList.remove('show');

    if (state.questions.length === 0) {
        const emptyMsg = state.mode === 'wrong' ? '没有错题，继续保持！🎉' : '暂无题目';
        area.innerHTML = `<div class="question-card" style="text-align:center;padding:48px 20px">
            <div style="font-size:48px;margin-bottom:16px">${state.mode === 'wrong' ? '🎉' : '📭'}</div>
            <div style="font-size:16px;color:#888">${emptyMsg}</div>
        </div>`;
        updateProgress();
        return;
    }

    // Wrong mode: show all wrong questions as read-only cards
    if (state.mode === 'wrong') {
        renderWrongList();
        return;
    }

    if (state.currentIndex >= state.questions.length) {
        showResult();
        return;
    }

    const q = state.questions[state.currentIndex];
    const isAnswered = state.answered[q.id];
    const labels = ['A', 'B', 'C', 'D'];
    const tfLabels = ['✓ 正确', '✗ 错误'];
    const typeLabel = q.type === 'true_false' ? '判断题' : q.type === 'choice' ? '选择题' : '填空题';

    let html = `<div class="question-card">
        <div class="q-number">
            第 ${state.currentIndex + 1} / ${state.questions.length} 题
            <span class="q-topic">${q.topic}</span>
            <span class="q-source">${q.source}</span>
            <span class="q-type">${typeLabel}</span>
        </div>
        <div class="q-text">${formatQuestion(q)}</div>`;

    if (q.type === 'choice' || q.type === 'true_false') {
        const useLabels = q.type === 'true_false' ? tfLabels : labels;
        html += `<div class="options ${q.type === 'true_false' ? 'tf-options' : ''}">`;
        q.options.forEach((opt, i) => {
            let cls = '';
            if (isAnswered) {
                cls = 'disabled';
                if (i === q.answer) cls += ' correct';
                else if (i === isAnswered.userAnswer) cls += ' wrong';
            }
            html += `<div class="option ${cls}" onclick="selectOption(${q.id}, ${i})">
                <div class="opt-label">${useLabels[i]}</div>
                <div>${opt}</div>
            </div>`;
        });
        html += `</div>`;
    } else {
        // Fill in the blank
        html += `<div style="position:relative">
            <input type="text" class="fill-input ${isAnswered ? (isAnswered.correct ? 'correct' : 'wrong') : ''}"
                   id="fillInput" placeholder="请输入答案..."
                   ${isAnswered ? `value="${isAnswered.userAnswer}" disabled` : ''}
                   onkeydown="if(event.key==='Enter')submitFill(${q.id})">
            <div class="correct-answer ${isAnswered && !isAnswered.correct ? 'show' : ''}" id="correctAnswer">
                正确答案：${q.answer}
            </div>
        </div>`;
        if (!isAnswered) {
            html += `<div class="btn-row">
                <button class="btn btn-primary" onclick="submitFill(${q.id})">提交答案</button>
            </div>`;
        }
    }

    // Explanation
    if (isAnswered) {
        html += `<div class="explanation show">${q.explanation}</div>`;
    }

    // Navigation buttons
    html += `<div class="btn-row" style="margin-top:16px">
        <button class="btn btn-secondary" ${state.currentIndex === 0 ? 'disabled' : ''} onclick="prevQuestion()">上一题</button>
        <button class="btn btn-primary" onclick="nextQuestion()">${state.currentIndex >= state.questions.length - 1 ? '查看结果' : '下一题'}</button>
    </div>`;

    html += `</div>`;
    area.innerHTML = html;
    updateProgress();
}

// Render wrong questions as a scrollable read-only list
function renderWrongList() {
    const area = document.getElementById('questionArea');
    const labels = ['A', 'B', 'C', 'D'];
    let html = '';

    state.questions.forEach((q, idx) => {
        const answered = state.answered[q.id];
        const tfLabels2 = ['✓', '✗'];
        const reviewLabels = q.type === 'true_false' ? tfLabels2 : labels;
        html += `<div class="wrong-card">
            <div class="wrong-result">
                <span style="font-weight:600;color:#333">错题 ${idx + 1}</span>
                <span class="q-topic" style="background:#f0f0ff;color:#667eea;font-size:11px;padding:2px 8px;border-radius:4px">${q.topic}</span>
                <span class="tag user">你的答案：${reviewLabels[answered.userAnswer]}</span>
                <span class="tag correct">正确答案：${reviewLabels[q.answer]}</span>
            </div>
            <div style="font-size:15px;line-height:1.7;margin-bottom:12px;font-weight:500">${formatQuestion(q)}</div>`;

        q.options.forEach((opt, i) => {
            let cls = 'review-only';
            if (i === q.answer) cls += ' is-correct';
            else if (i === answered.userAnswer) cls += ' is-wrong';
            html += `<div class="option ${cls}">
                <div style="flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin-right:10px;${i === q.answer ? 'background:#2ed573;color:white' : (i === answered.userAnswer ? 'background:#ff4757;color:white' : 'background:#f0f0f0;color:#888')}">${reviewLabels[i]}</div>
                <div>${opt}</div>
            </div>`;
        });

        html += `<div class="explanation show" style="margin-top:12px">${q.explanation}</div>`;
        html += `</div>`;
    });

    area.innerHTML = html;
    updateProgress();
}

function formatQuestion(q) {
    if (q.type === 'fill') {
        return q.question.replace('____', '<span class="q-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    }
    return q.question.replace(/\n/g, '<br>');
}

function selectOption(qId, optIndex) {
    const q = QUESTIONS.find(x => x.id === qId);
    if (!q || state.answered[qId]) return;

    const isCorrect = optIndex === q.answer;
    state.answered[qId] = { correct: isCorrect, userAnswer: optIndex };
    if (isCorrect) {
        state.correctCount++;
        state.wrongIds.delete(qId);
    } else {
        state.wrongCount++;
        state.wrongIds.add(qId);
    }
    saveProgress();
    updateStats();
    renderQuestion();
}

function submitFill(qId) {
    const input = document.getElementById('fillInput');
    if (!input) return;
    const userAnswer = input.value.trim();
    if (!userAnswer) return;

    const q = QUESTIONS.find(x => x.id === qId);
    if (!q || state.answered[qId]) return;

    // Check answer (support multiple answers separated by comma)
    const answers = q.answer.split(',').map(a => a.trim());
    const isCorrect = answers.some(a => userAnswer === a || userAnswer.includes(a));

    state.answered[qId] = { correct: isCorrect, userAnswer };
    if (isCorrect) {
        state.correctCount++;
        state.wrongIds.delete(qId);
    } else {
        state.wrongCount++;
        state.wrongIds.add(qId);
    }
    saveProgress();
    updateStats();
    renderQuestion();
}

function prevQuestion() {
    if (state.currentIndex > 0) {
        state.currentIndex--;
        renderQuestion();
    }
}

function nextQuestion() {
    if (state.currentIndex < state.questions.length - 1) {
        state.currentIndex++;
        renderQuestion();
    } else {
        showResult();
    }
}

// ===================== PROGRESS & STATS =====================
function updateProgress() {
    const total = state.questions.length;
    const done = state.questions.filter(q => state.answered[q.id]).length;
    const pct = total > 0 ? (done / total * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
}

function updateStats() {
    document.getElementById('stat-correct').textContent = state.correctCount;
    document.getElementById('stat-wrong').textContent = state.wrongCount;
    const done = Object.keys(state.answered).length;
    document.getElementById('stat-done').textContent = done;
    document.getElementById('stat-total').textContent = QUESTIONS.length;
    renderMonthGrid();
}

// ===================== RESULT =====================
function showResult() {
    const area = document.getElementById('questionArea');
    area.innerHTML = '';
    const panel = document.getElementById('resultPanel');
    panel.classList.add('show');

    const doneQs = state.questions.filter(q => state.answered[q.id]);
    const correctQs = doneQs.filter(q => state.answered[q.id].correct);
    const pct = doneQs.length > 0 ? Math.round(correctQs.length / doneQs.length * 100) : 0;

    document.getElementById('resultScore').textContent = pct + '%';
    document.getElementById('resultCorrect').textContent = correctQs.length;
    document.getElementById('resultWrong').textContent = doneQs.length - correctQs.length;
    document.getElementById('resultTotal').textContent = doneQs.length;
}

function reviewWrong() {
    // Filter to wrong questions only
    state.questions = QUESTIONS.filter(q => state.wrongIds.has(q.id));
    state.currentIndex = 0;
    renderQuestion();
}

function restartQuiz() {
    if (confirm('确定要重置所有做题记录吗？')) {
        state.answered = {};
        state.wrongIds = new Set();
        state.correctCount = 0;
        state.wrongCount = 0;
        state.currentIndex = 0;
        saveProgress();
        updateStats();
        filterQuestions();
        renderQuestion();
    }
}

// ===================== INIT =====================
async function init() {
    await loadQuestions();
    loadProgress();
    filterQuestions();
    renderMonthGrid();
    updateStats();
    renderQuestion();
}

init();
</script>

</body>
</html>
